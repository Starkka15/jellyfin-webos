  <circle cx="128" cy="128" r="126" fill="url(#plate)"/>
  <ellipse cx="128" cy="214" rx="86" ry="18" fill="url(#shadow)"/>
  <circle cx="128" cy="124" r="98" fill="url(#rim)"/>
